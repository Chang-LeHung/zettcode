name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import ast
          import os
          import pathlib

          tag = os.environ["GITHUB_REF_NAME"]
          # The version is written once, in the package; pyproject asks hatchling
          # to read the same file, so this is what the built distribution carries.
          tree = ast.parse(pathlib.Path("zettcode/src/zettcode/__init__.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and getattr(node.targets[0], "id", "") == "__version__"
          )
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}; expected {expected!r}")
          print(f"tag {tag} matches project version {version}")
          PY

      # The gateway's page is built from clients/gateway into the package; it is not in git, so a wheel made without this
      # step would serve an API and no page.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build the gateway page
        working-directory: clients/gateway
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build
        # A v* tag publishes the package: the terminal agent and the HTTP server ship together, with one version.
        run: uv build --package zettcode

      - name: Check distribution metadata
        run: uv run --no-project --with twine twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zettcode
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"

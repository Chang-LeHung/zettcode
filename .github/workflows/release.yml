name: Release

# One version, one tag, every distribution the program is made of. The order they are built and published in is
# generated from their `pyproject.toml` files by `.github/scripts/release_order.py` — the same script `make build`
# reads — so nothing keeps a second list. The plugins are not here: they have their own line and their own workflow
# (`.github/workflows/release-packages.yml`).

on:
  push:
    tags: ["v*"]
  # A run by hand builds everything; `publish` uploads it too, without a tag and without a GitHub release, and
  # `exclude` names distributions to leave out of the upload (space separated). That is how the parts are released
  # ahead of the program itself: the program's own tag comes after, and finds the rest already on PyPI.
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (no tag, no GitHub release)"
        type: boolean
        default: false
      exclude:
        description: "Distributions to leave out of the upload, space separated (e.g. zettcode)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import ast
          import os
          import pathlib

          tag = os.environ["GITHUB_REF_NAME"]
          # The version is written once, in the engine's tree; every distribution's pyproject points at the same file.
          tree = ast.parse(pathlib.Path("packages/zettcode-engine/src/zettcode/version.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and getattr(node.targets[0], "id", "") == "__version__"
          )
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}; expected {expected!r}")
          print(f"tag {tag} matches project version {version}")
          PY

      - name: Check every distribution is on this version
        # One number for the program, its parts and its plugins, and a floor on every requirement that says so. A tag
        # whose tree still names an older version on a plugin, or a range that starts below what is being published,
        # would publish a set that cannot be installed together — so it stops here rather than at PyPI.
        run: uv run --no-project python .github/scripts/versions.py --check

      # The gateway's page is built from clients/gateway into the gateway's distribution; it is not in git, so a wheel
      # made without this step would serve an API and no page.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build the gateway page
        working-directory: clients/gateway
        run: npm ci --no-audit --no-fund && npm run build

      # One directory per distribution, so the files a later job publishes are exactly the ones this run built, and
      # the order is the dependency order: nothing is published before what it needs.
      - name: Build
        run: |
          set -euo pipefail
          for name in $(python3 .github/scripts/release_order.py); do
            echo "::group::$name"
            uv build "packages/$name" --out-dir "dist/$name"
            echo "::endgroup::"
          done

      - name: Check distribution metadata
        run: uv run --no-project --with twine twine check dist/*/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # In order, and stopping at the first failure: a distribution whose dependency did not publish would install
      # something else from PyPI. `--check-url` makes a re-run skip what is already there instead of failing.
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          EXCLUDE: ${{ github.event_name == 'workflow_dispatch' && inputs.exclude || '' }}
        run: |
          set -euo pipefail
          for name in $(python3 .github/scripts/release_order.py); do
            if [[ " $EXCLUDE " == *" $name "* ]]; then
              echo "$name is left out of this upload"
              continue
            fi
            echo "::group::$name"
            # A project PyPI already has takes a new version with no limit. A brand-new name counts against PyPI's
            # new-project quota — four in twenty-four hours for a personal account (pypi/support#11479; ten for an
            # organization) — and every attempt counts, rejected ones included. So a new name waits a minute before
            # it is tried, an upload that fails stops the run rather than burning the quota, and the job is
            # idempotent: `--check-url` skips what is published, so one re-run a day later finishes the rest.
            if ! curl -fsS "https://pypi.org/pypi/$name/json" > /dev/null 2>&1; then
              echo "$name is new to PyPI; waiting a minute before creating it"
              sleep 60
            fi
            if ! uv publish --check-url https://pypi.org/simple/ "dist/$name"/*; then
              echo "::error::$name could not be published; if PyPI answered 429 for a new project name, the quota is a slow clock — re-run this job once it has cleared"
              exit 1
            fi
            echo "::endgroup::"
          done

  release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*/* --generate-notes --title "$GITHUB_REF_NAME"

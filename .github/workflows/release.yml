name: Release

# One version, one tag, every distribution the program is made of. `packages/order.txt` is the dependency order they
# are built and published in, and it is the same list `make build` reads. The plugins are not here: they have their own
# line and their own workflow (`.github/workflows/release-packages.yml`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import ast
          import os
          import pathlib

          tag = os.environ["GITHUB_REF_NAME"]
          # The version is written once, in the engine's tree; every distribution's pyproject points at the same file.
          tree = ast.parse(pathlib.Path("packages/zettcode-engine/src/zettcode/version.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and getattr(node.targets[0], "id", "") == "__version__"
          )
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}; expected {expected!r}")
          print(f"tag {tag} matches project version {version}")
          PY

      # The gateway's page is built from clients/gateway into the gateway's distribution; it is not in git, so a wheel
      # made without this step would serve an API and no page.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build the gateway page
        working-directory: clients/gateway
        run: npm ci --no-audit --no-fund && npm run build

      # One directory per distribution, so the files a later job publishes are exactly the ones this run built, and
      # the order is the dependency order: nothing is published before what it needs.
      - name: Build
        run: |
          set -euo pipefail
          for name in $(grep -v '^#' packages/order.txt); do
            echo "::group::$name"
            uv build "packages/$name" --out-dir "dist/$name"
            echo "::endgroup::"
          done

      - name: Check distribution metadata
        run: uv run --no-project --with twine twine check dist/*/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # In order, and stopping at the first failure: a distribution whose dependency did not publish would install
      # something else from PyPI. `--check-url` makes a re-run skip what is already there instead of failing.
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in $(grep -v '^#' packages/order.txt); do
            echo "::group::$name"
            uv publish --check-url https://pypi.org/simple/ "dist/$name"/*
            echo "::endgroup::"
          done

  release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*/* --generate-notes --title "$GITHUB_REF_NAME"

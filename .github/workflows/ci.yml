name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.files.outputs.lint }}
      python: ${{ steps.files.outputs.python }}
      monitor: ${{ steps.files.outputs.monitor }}
      typescript: ${{ steps.files.outputs.typescript }}
      vscode: ${{ steps.files.outputs.vscode }}
      gateway: ${{ steps.files.outputs.gateway }}
      package: ${{ steps.files.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base commit, which a shallow clone does not have.
          fetch-depth: 0

      # The split is the one `make check` uses: the Python gate for `zettcode/`, a lock file or the root
      # `pyproject.toml`; the client for its own directory; the extension for itself or the client it bundles; the
      # gateway page for its own directory, and with the wheel that ships it; the plugin for `plugins/` and for any
      # change to the zettcode its suite runs against. The Makefile and the workflows themselves count as every
      # file, because either can change what a suite means.
      - name: Read the files this change touches
        id: files
        shell: bash
        run: |
          set -euo pipefail

          base=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
          esac

          everything=false
          files="."
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # A first push, a base that is no longer there, or a manual run: nothing to compare against.
            everything=true
          elif ! files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"; then
            everything=true
          fi

          if grep -qxE 'Makefile|\.github/workflows/.*' <<<"$files"; then
            everything=true
          fi
          if [ "$everything" = true ]; then
            files="."
          fi

          # A pattern that matches nothing is a false branch, not a failure.
          matches() { [ "$everything" = true ] && return 0; grep -qE "$1" <<<"$files"; }

          python=false;     matches '^(zettcode/|pyproject\.toml|uv\.lock)' && python=true
          lint=false;       [ "$python" = true ] && lint=true;  matches '^docs/scripts/' && lint=true
          monitor=false;    [ "$python" = true ] && monitor=true;  matches '^plugins/' && monitor=true
          typescript=false; matches '^clients/typescript/' && typescript=true
          vscode=false;     [ "$typescript" = true ] && vscode=true;  matches '^clients/vscode/' && vscode=true
          gateway=false;    matches '^clients/gateway/' && gateway=true
          package=false;    [ "$python" = true ] && package=true;  [ "$gateway" = true ] && package=true

          echo "Reading the change against ${base:-nothing}:"
          printf '%s\n' "$files" | head -20 | sed 's/^/  /'
          {
            echo "lint=$lint"
            echo "python=$python"
            echo "monitor=$monitor"
            echo "typescript=$typescript"
            echo "vscode=$vscode"
            echo "gateway=$gateway"
            echo "package=$package"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Ruff
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Check formatting
        run: uv run --no-sync ruff format --check zettcode/src zettcode/tests zettcode/perf docs/scripts

      - name: Lint
        run: uv run --no-sync ruff check zettcode/src zettcode/tests zettcode/perf docs/scripts

      # The configuration at the workspace root covers the package.
      - name: Type-check
        run: uv run --no-sync mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every claimed version, starting at the floor: a construct or a stdlib
        # name the oldest runtime lacks only fails there.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Run tests
        working-directory: zettcode
        run: uv run --no-sync pytest

  monitor:
    name: Monitor plugin
    needs: changes
    if: needs.changes.outputs.monitor == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin is not a workspace member, so its own pyproject owns the
        # interpreter range: the floor and the newest version claimed cover it.
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      # The plugin runs from its source against the zettcode in this checkout,
      # not from a built wheel: what this job checks is that the plugin still
      # speaks the API of the zettcode beside it and that the ranges it declares
      # admit that release. Installing the two from PyPI is the release
      # workflow's job, where the release it names exists.
      - name: Run tests
        run: uv run --no-sync python -m pytest plugins/zettcode-monitor/tests -q
        env:
          PYTHONPATH: plugins/zettcode-monitor/src

  test-windows:
    name: Tests (Windows, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the version that also installs the ``exceptiongroup`` and
        # ``tomli`` backports, so the old path is exercised here as well.
        python-version: ["3.10", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      # The console layer has a Windows path with no POSIX equivalent, so the
      # suite runs there too: the platform seam, the reader thread, and the
      # resize poll are exercised on the platform that needs them.
      - name: Run tests
        working-directory: zettcode
        run: uv run --no-sync pytest

  typescript:
    name: TypeScript client
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install
        working-directory: clients/typescript
        run: npm ci --no-audit --no-fund

      # The tests compile the sources and then speak the API to a real local server over a socket.
      - name: Test
        working-directory: clients/typescript
        run: npm test

  gateway:
    name: Gateway page
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/gateway/package-lock.json

      - name: Install
        working-directory: clients/gateway
        run: npm ci --no-audit --no-fund

      - name: Type-check and test
        working-directory: clients/gateway
        run: npm run check && npm test

      - name: Build
        working-directory: clients/gateway
        run: npm run build

  vscode:
    name: VS Code extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: Install
        working-directory: clients/vscode
        run: npm ci --no-audit --no-fund

      # The suite bundles the webview and drives it in jsdom; no display or editor is needed.
      - name: Type-check and test
        working-directory: clients/vscode
        run: npm run check && npm test

      - name: Build the extension bundles
        working-directory: clients/vscode
        run: npm run build

  package:
    name: Build and smoke-test the wheels
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.15"
          enable-cache: true

      # The gateway's page is built into the wheel and is not in git, so Node is needed to make the wheel.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The Makefile target owns the smoke test, so the thing a contributor runs
      # is the thing CI runs. It builds into .smoke/ rather than dist/, so the
      # wheel it installs cannot be one left over from an earlier build.
      - name: Build and smoke-test the wheel
        run: make smoke

      - name: Verify the wheel ships both programs
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob(".smoke/zettcode-*.whl")
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          archive = zipfile.ZipFile(wheel)
          names = archive.namelist()
          assert any(name.startswith("zettcode/server/") for name in names), names
          entry_points = [name for name in names if name.endswith("entry_points.txt")]
          assert len(entry_points) == 1, names
          written = archive.read(entry_points[0]).decode()
          assert "zettcode = zettcode.cli:main" in written, written
          assert "zettcode-server = zettcode.server.cli:main" in written, written
          print(f"{wheel}: {len(names)} files, both console scripts")
          PY

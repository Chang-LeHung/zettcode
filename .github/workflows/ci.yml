name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.files.outputs.lint }}
      python: ${{ steps.files.outputs.python }}
      typescript: ${{ steps.files.outputs.typescript }}
      vscode: ${{ steps.files.outputs.vscode }}
      gateway: ${{ steps.files.outputs.gateway }}
      desktop: ${{ steps.files.outputs.desktop }}
      mobile: ${{ steps.files.outputs.mobile }}
      package: ${{ steps.files.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base commit, which a shallow clone does not have.
          fetch-depth: 0

      # The split is the one `make check` uses: the Python gate for `packages/` (every distribution of the
      # workspace, the program and its parts, and the plugins), a lock file or the root `pyproject.toml` — the
      # workspace is one environment, so a change to a plugin can break the program and the other way round; the
      # client for its own directory; the extension for itself or the client it bundles; the gateway page for its
      # own directory, and with the wheels that ship it. The Makefile and the workflows themselves count as every
      # file, because either can change what a suite means.
      - name: Read the files this change touches
        id: files
        shell: bash
        run: |
          set -euo pipefail

          base=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
          esac

          everything=false
          files="."
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # A first push, a base that is no longer there, or a manual run: nothing to compare against.
            everything=true
          elif ! files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"; then
            everything=true
          fi

          if grep -qxE 'Makefile|\.github/workflows/.*' <<<"$files"; then
            everything=true
          fi
          if [ "$everything" = true ]; then
            files="."
          fi

          # A pattern that matches nothing is a false branch, not a failure.
          matches() { [ "$everything" = true ] && return 0; grep -qE "$1" <<<"$files"; }

          python=false;     matches '^(packages/|support/|conftest\.py|\.github/scripts/|pyproject\.toml|uv\.lock)' && python=true
          lint=false;       [ "$python" = true ] && lint=true;  matches '^docs/scripts/' && lint=true
          typescript=false; matches '^clients/typescript/' && typescript=true
          vscode=false;     [ "$typescript" = true ] && vscode=true;  matches '^clients/vscode/' && vscode=true
          gateway=false;    matches '^clients/gateway/' && gateway=true
          desktop=false;    matches '^clients/desktop/|^\.github/workflows/desktop\.yml' && desktop=true
          mobile=false;     matches '^clients/mobile/' && mobile=true
          package=false;    [ "$python" = true ] && package=true;  [ "$gateway" = true ] && package=true

          echo "Reading the change against ${base:-nothing}:"
          printf '%s\n' "$files" | head -20 | sed 's/^/  /'
          {
            echo "lint=$lint"
            echo "python=$python"
            echo "typescript=$typescript"
            echo "vscode=$vscode"
            echo "gateway=$gateway"
            echo "desktop=$desktop"
            echo "mobile=$mobile"
            echo "package=$package"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Ruff
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Check formatting
        run: uv run --no-sync ruff format --check conftest.py support docs/scripts .github/scripts packages

      - name: Lint
        run: uv run --no-sync ruff check conftest.py support docs/scripts .github/scripts packages

      # The configuration at the workspace root covers every package, the plugins included.
      - name: Type-check
        run: uv run --no-sync mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every claimed version, starting at the floor: a construct or a stdlib
        # name the oldest runtime lacks only fails there.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      # The workspace's suites, the same way a contributor runs them: the program's, and each plugin's against the
      # zettcode in this checkout. Installing the plugins from PyPI is the release workflows' job, where the release
      # they name exists; what this checks is that they still speak the API of the code beside them and that the
      # ranges they declare admit it.
      - name: Run tests
        run: make test

  test-windows:
    name: Tests (Windows, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the version that also installs the ``exceptiongroup`` and
        # ``tomli`` backports, so the old path is exercised here as well.
        python-version: ["3.10", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      # The console layer has a Windows path with no POSIX equivalent, so the
      # suite runs there too: the platform seam, the reader thread, and the
      # resize poll are exercised on the platform that needs them.
      #
      # This is the serial loop `TEST_JOBS=1 make test` takes, spelled out because `make` is not on a Windows
      # runner; the six suites `make test` gives xdist workers get `-n 2` here too, so the worker path is exercised
      # on the platform whose process spawn is its own implementation.
      - name: Run the tests
        shell: bash
        run: |
          for suite in packages/*/tests; do
            name=${suite#packages/}; name=${name%%/*}
            workers=""
            case "$name" in
              zettcode|zettcode-app|zettcode-broker|zettcode-messaging|zettcode-sdk|zettcode-server) workers="-n 2" ;;
            esac
            echo "--- $suite"
            uv run --no-sync pytest "$suite" -q $workers || exit 1
          done

  typescript:
    name: TypeScript client
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install
        working-directory: clients/typescript
        run: npm ci --no-audit --no-fund

      # The tests compile the sources and then speak the API to a real local server over a socket.
      - name: Test
        working-directory: clients/typescript
        run: npm test

  gateway:
    name: Gateway page
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/gateway/package-lock.json

      - name: Install
        working-directory: clients/gateway
        run: npm ci --no-audit --no-fund

      - name: Type-check and test
        working-directory: clients/gateway
        run: npm run check && npm test

      - name: Build the page and its app bundle
        working-directory: clients/gateway
        run: npm run build && npm run build:app

  desktop:
    name: Desktop app
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    env:
      # The tests and the build do not start Electron; downloading its runtime here would only cost a minute.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install
        working-directory: clients/desktop
        run: npm ci --no-audit --no-fund

      - name: Type-check, test and build
        working-directory: clients/desktop
        run: npm run check && npm test && npm run build

  mobile:
    name: Phone app
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json

      - name: Install
        working-directory: clients/mobile
        run: npm ci --no-audit --no-fund

      # No Android SDK is needed to copy `web/` into the Gradle project; `make mobile-apk` is the one that needs a
      # device toolchain, and this job says the native project is still in sync.
      - name: Type-check and sync
        working-directory: clients/mobile
        run: npm run check && npm run sync

  vscode:
    name: VS Code extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: Install
        working-directory: clients/vscode
        run: npm ci --no-audit --no-fund

      # The suite bundles the webview and drives it in jsdom; no display or editor is needed.
      - name: Type-check and test
        working-directory: clients/vscode
        run: npm run check && npm test

      - name: Build the extension bundles
        working-directory: clients/vscode
        run: npm run build

  package:
    name: Build and smoke-test the wheels
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.15"
          enable-cache: true

      # The gateway's page is built into the wheel and is not in git, so Node is needed to make the wheel.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The Makefile target owns the smoke test, so the thing a contributor runs
      # is the thing CI runs. It builds into .smoke/ rather than dist/, so the
      # wheel it installs cannot be one left over from an earlier build.
      - name: Build and smoke-test the wheel
        run: make smoke

      # The two programs are two distributions now: the program writes both console scripts, and the server's own wheel
      # carries `zettcode/server/`. A misspelt entry point or a wheel that stopped shipping its code has to fail here.
      - name: Verify the wheels ship both programs
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          program = glob.glob(".smoke/zettcode-0.*.whl")
          assert len(program) == 1, program
          with zipfile.ZipFile(program[0]) as archive:
              names = archive.namelist()
              entry_points = [name for name in names if name.endswith("entry_points.txt")]
              assert len(entry_points) == 1, names
              written = archive.read(entry_points[0]).decode()
          assert "zettcode = zettcode.cli:main" in written, written
          assert "zettcode-server = zettcode.server.cli:main" in written, written

          server = glob.glob(".smoke/zettcode_server-0.*.whl")
          assert len(server) == 1, server
          with zipfile.ZipFile(server[0]) as archive:
              carried = archive.namelist()
          assert any(name.startswith("zettcode/server/") for name in carried), carried

          print(f"{program[0]} writes both console scripts; {server[0]} carries the server")
          PY

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests

      - name: Lint
        run: uv run --no-sync ruff check src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every claimed version, starting at the floor: a construct or a stdlib
        # name the oldest runtime lacks only fails there.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run --no-sync pytest

  test-windows:
    name: Tests (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the version that also installs the ``exceptiongroup`` and
        # ``tomli`` backports, so the old path is exercised here as well.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      # The console layer has a Windows path with no POSIX equivalent, so the
      # suite runs there too: the platform seam, the reader thread, and the
      # resize poll are exercised on the platform that needs them.
      - name: Run tests
        run: uv run --no-sync pytest

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Verify the wheel ships the TUI package
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(name.startswith("zettcode/") for name in names), names
          entry_points = [name for name in names if name.endswith("entry_points.txt")]
          assert entry_points, names
          print(f"{wheel}: {len(names)} files")
          PY

      - name: Run the console script from the built wheel
        run: uv run --no-project --python 3.14 --with ./dist/*.whl zettcode --help

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Check formatting
        run: uv run --no-sync ruff format --check zettcode/src zettcode/tests zettcode/perf zettcode-server/src zettcode-server/tests docs/scripts

      - name: Lint
        run: uv run --no-sync ruff check zettcode/src zettcode/tests zettcode/perf zettcode-server/src zettcode-server/tests docs/scripts

      # The configuration at the workspace root covers both packages.
      - name: Type-check
        run: uv run --no-sync mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every claimed version, starting at the floor: a construct or a stdlib
        # name the oldest runtime lacks only fails there.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Run tests (the agent)
        working-directory: zettcode
        run: uv run --no-sync pytest

      - name: Run tests (the server)
        working-directory: zettcode-server
        run: uv run --no-sync pytest

  test-windows:
    name: Tests (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the version that also installs the ``exceptiongroup`` and
        # ``tomli`` backports, so the old path is exercised here as well.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      # The console layer has a Windows path with no POSIX equivalent, so the
      # suite runs there too: the platform seam, the reader thread, and the
      # resize poll are exercised on the platform that needs them.
      - name: Run tests (the agent)
        working-directory: zettcode
        run: uv run --no-sync pytest

      - name: Run tests (the server)
        working-directory: zettcode-server
        run: uv run --no-sync pytest

  package:
    name: Build and smoke-test the wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      # The Makefile target owns the smoke test, so the thing a contributor runs
      # is the thing CI runs. It builds into .smoke/ rather than dist/, so the
      # wheel it installs cannot be one left over from an earlier build.
      - name: Build and smoke-test the wheel
        run: make smoke

      - name: Build and smoke-test the wheels
        run: make smoke

      - name: Verify the wheel ships the agent package
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob(".smoke/zettcode-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(name.startswith("zettcode/") for name in names), names
          entry_points = [name for name in names if name.endswith("entry_points.txt")]
          assert entry_points, names
          print(f"{wheel}: {len(names)} files")
          PY

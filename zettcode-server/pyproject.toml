[project]
name = "zettcode-server"
description = "The ZettCode coding agent behind an HTTP API: prompts, streaming, sessions and models"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["agent", "llm", "http", "api", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # The agent, as a released package: the server drives it through its SDK and
  # carries no copy of the model loop, the tools, or the session store.
  "zettcode>=0.1.8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  # Returned by every endpoint and read back by the tests; the SDK's own runs
  # speak to the provider with it.
  "httpx>=0.27,<1",
]

[project.scripts]
zettcode-server = "zettcode_server.cli:main"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth: the version is written once, in the package.
path = "src/zettcode_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode_server"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "zettcode-workspace"
version = "0.0.0"
description = "The ZettCode workspace: one distribution per subsystem, and the plugins published beside them"
requires-python = ">=3.10"

# A virtual project: nothing here is published, and `uv build` builds the member.
[tool.uv]
package = false

[tool.uv.workspace]
# Every distribution in the repository. `zettcode/` is the program a reader installs; the rest are the parts it is
# made of (`zettcode-engine`, `-tui`, `-broker`, `-sdk`, `-server`, `-gateway`, `-app`) and the plugins published on
# their own lines. They share one environment, one lock file and the tooling configured here.
members = ["packages/*"]

[dependency-groups]
# One environment, so the tools are installed once and the same versions check every package.
dev = [
  # Unlike the conditional runtime deps, these are installed on every
  # interpreter so mypy can check the 3.10 branch of ``_compat`` for real.
  "exceptiongroup>=1.2,<2",
  "mypy>=1.14,<2",
  # Imported by the suite that checks the extras and the plugins' ranges against what this workspace builds.
  "packaging>=24,<27",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.11,<1",
  "tomli>=2,<3",
  "viztracer>=1.1.1",
  # The program, which pulls every other distribution of this workspace and the tiktoken extra. `uv sync` then has
  # the whole thing, the way `pip install zettcode` would, without `--all-packages`.
  "zettcode",
  # The plugins are developed beside the program and are workspace members, so this checkout's environment carries
  # them: `/recap` and `/monitor` are in the menu when the terminal runs from here. They are not dependencies of the
  # package; a reader installs one from an extra in `packages/zettcode/pyproject.toml` instead.
  "zettcode-monitor",
  "zettcode-recap",
  # The chat bridge is a program of its own, not a dependency of `zettcode`, but its suite runs in this environment
  # like every other member's.
  "zettcode-im",
]

[tool.uv.sources]
# Every package resolves from this checkout, not from an index: the workspace member is what `uv lock` and `uv sync`
# see, and the extras in `packages/zettcode/pyproject.toml` are still how a reader installs a released plugin from
# PyPI. uv resolves a member without checking the range that asks for it (the lock records no specifier), so the
# ranges are what nothing else would catch: `packages/zettcode/tests/test_structure.py` checks the extras against the versions built
# here, and each plugin's suite checks its `zettcode` range against the checkout's.
zettcode = { workspace = true }
zettcode-app = { workspace = true }
zettcode-broker = { workspace = true }
zettcode-engine = { workspace = true }
zettcode-tools = { workspace = true }
zettcode-memory = { workspace = true }
zettcode-gateway = { workspace = true }
zettcode-sdk = { workspace = true }
zettcode-server = { workspace = true }
zettcode-tui = { workspace = true }
zettcode-plugin-api = { workspace = true }
zettcode-presenters = { workspace = true }
zettcode-pets = { workspace = true }
zettcode-commands = { workspace = true }
zettcode-skills = { workspace = true }
zettcode-mcp = { workspace = true }
zettcode-messaging = { workspace = true }
zettcode-files = { workspace = true }
zettcode-jit-harness = { workspace = true }
zettcode-ask-user = { workspace = true }
zettcode-instructions = { workspace = true }
zettcode-todos = { workspace = true }
zettcode-tool-output = { workspace = true }
zettcode-truncation = { workspace = true }
zettcode-guidance = { workspace = true }
zettcode-monitor = { workspace = true }
zettcode-recap = { workspace = true }
zettcode-im = { workspace = true }

[tool.mypy]
python_version = "3.10"
# `zettcode` is a PEP 420 namespace spread over one source tree per distribution, so every tree is a package base and
# a module is named for the namespace, not for the directory mypy happened to find it in.
explicit_package_bases = true
mypy_path = [
  "packages/zettcode-engine/src",
  "packages/zettcode-tools/src",
  "packages/zettcode-memory/src",
  "packages/zettcode-tui/src",
  "packages/zettcode-broker/src",
  "packages/zettcode-sdk/src",
  "packages/zettcode-server/src",
  "packages/zettcode-gateway/src",
  "packages/zettcode-app/src",
  "packages/zettcode-plugin-api/src",
  "packages/zettcode-presenters/src",
  "packages/zettcode-pets/src",
  "packages/zettcode-commands/src",
  "packages/zettcode-skills/src",
  "packages/zettcode-mcp/src",
  "packages/zettcode-messaging/src",
  "packages/zettcode-files/src",
  "packages/zettcode-jit-harness/src",
  "packages/zettcode-ask-user/src",
  "packages/zettcode-instructions/src",
  "packages/zettcode-todos/src",
  "packages/zettcode-tool-output/src",
  "packages/zettcode-truncation/src",
  "packages/zettcode-guidance/src",
  "packages/zettcode-im/src",
  "packages/zettcode/src",
  "packages/zettcode",
  ".github/scripts",
]
files = [
  "packages/zettcode-engine/src",
  "packages/zettcode-tools/src",
  "packages/zettcode-memory/src",
  "packages/zettcode-tui/src",
  "packages/zettcode-broker/src",
  "packages/zettcode-sdk/src",
  "packages/zettcode-server/src",
  "packages/zettcode-gateway/src",
  "packages/zettcode-app/src",
  "packages/zettcode-plugin-api/src",
  "packages/zettcode-presenters/src",
  "packages/zettcode-pets/src",
  "packages/zettcode-commands/src",
  "packages/zettcode-skills/src",
  "packages/zettcode-mcp/src",
  "packages/zettcode-messaging/src",
  "packages/zettcode-files/src",
  "packages/zettcode-jit-harness/src",
  "packages/zettcode-ask-user/src",
  "packages/zettcode-instructions/src",
  "packages/zettcode-todos/src",
  "packages/zettcode-tool-output/src",
  "packages/zettcode-truncation/src",
  "packages/zettcode-guidance/src",
  "packages/zettcode-im/src",
  "packages/zettcode/src",
  "packages/zettcode/perf",
  "packages/zettcode-monitor/src",
  "packages/zettcode-recap/src",
  ".github/scripts",
]
# Check the pydantic storage models as models, not as plain classes.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Ships no stubs; the runner only calls the two documented functions.
module = ["pyperclip"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
# Every distribution, its suite included, and the shared test support at the root.
src = ["packages", "support"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zettcode"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

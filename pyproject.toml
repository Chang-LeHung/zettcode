[project]
name = "zettcode-workspace"
version = "0.0.0"
description = "The ZettCode workspace: the terminal coding agent and the HTTP server it ships"
requires-python = ">=3.10"

# A virtual project: nothing here is published, and `uv build` builds the member.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["zettcode"]

[dependency-groups]
# One package, so the tools are installed once and the same versions check everything.
dev = [
  # Unlike the conditional runtime deps, these are installed on every
  # interpreter so mypy can check the 3.10 branch of ``_compat`` for real.
  "exceptiongroup>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=7.1.0",
  "ruff>=0.11,<1",
  "tomli>=2,<3",
  "viztracer>=1.1.1",
  # The recap plugin is developed beside the program, so this checkout's environment carries it: `/recap` is in the
  # menu when the terminal runs from here. It is not a dependency of the package; once it is released, a reader
  # installs it from an extra in `zettcode/pyproject.toml` instead.
  "zettcode-recap",
]

[tool.uv.sources]
# The plugin is built from this checkout, not from an index, until its first release; after that the extra is the
# published path and this source stays for local development.
zettcode-recap = { path = "plugins/zettcode-recap", editable = true }

[tool.mypy]
python_version = "3.10"
files = ["zettcode/src", "zettcode/perf"]
# Check the pydantic storage models as models, not as plain classes.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Ships no stubs; the runner only calls the two documented functions.
module = ["pyperclip"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["zettcode/src", "zettcode/tests", "zettcode/perf"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zettcode"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

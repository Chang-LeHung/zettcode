[project]
name = "zettcode"
description = "A focused terminal coding agent powered by zett-agent"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang-LeHung"}]
keywords = ["agent", "llm", "tui", "terminal", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  # The stdlib gained both of these in 3.11; older runtimes take the backports.
  "exceptiongroup>=1.2,<2; python_version < '3.11'",
  "pyperclip>=1.9,<2",
  "tomli>=2,<3; python_version < '3.11'",
  "wcwidth>=0.2,<1",
  "zett-agent==0.1.10",
]

[project.scripts]
zettcode = "zettcode.cli:main"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth: the version is written once, in the package.
path = "src/zettcode/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/README.zh-CN.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
dev = [
  # Unlike the conditional runtime deps, these are installed on every
  # interpreter so mypy can check the 3.10 branch of ``_compat`` for real.
  "exceptiongroup>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=7.1.0",
  "ruff>=0.11,<1",
  "tomli>=2,<3",
  "viztracer>=1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
files = ["src", "perf"]
# Check the pydantic storage models as models, not as plain classes.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Ships no stubs; the runner only calls the two documented functions.
module = ["pyperclip"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "perf"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zettcode"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

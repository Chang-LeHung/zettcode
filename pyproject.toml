[project]
name = "zettcode-workspace"
version = "0.0.0"
description = "The ZettCode workspace: the terminal coding agent and its server"
requires-python = ">=3.10"

# A virtual project: nothing here is published, and `uv build` builds the members.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["zettcode", "zettcode-server"]

[tool.uv.sources]
zettcode = { workspace = true }

[dependency-groups]
# Shared by both packages, so the tools are installed once and the same versions check everything.
dev = [
  # Unlike the conditional runtime deps, these are installed on every
  # interpreter so mypy can check the 3.10 branch of ``_compat`` for real.
  "exceptiongroup>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=7.1.0",
  "ruff>=0.11,<1",
  "tomli>=2,<3",
  "viztracer>=1.1.1",
]

[tool.mypy]
python_version = "3.10"
files = ["zettcode/src", "zettcode/perf", "zettcode-server/src"]
# Check the pydantic storage models as models, not as plain classes.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Ships no stubs; the runner only calls the two documented functions.
module = ["pyperclip"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["zettcode/src", "zettcode/tests", "zettcode/perf", "zettcode-server/src", "zettcode-server/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zettcode", "zettcode_server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

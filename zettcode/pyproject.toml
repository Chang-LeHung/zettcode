[project]
name = "zettcode"
description = "A focused terminal coding agent powered by zett-agent"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["agent", "llm", "tui", "terminal", "coding-agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # The stdlib gained both of these in 3.11; older runtimes take the backports.
  "exceptiongroup>=1.2,<2; python_version < '3.11'",
  # Imported directly by the session store's record and metadata codecs, so it
  # is declared here rather than borrowed from the runtime that brings it today.
  "pydantic>=2,<3",
  "pyperclip>=1.9,<2",
  "setproctitle>=1.3.7,<2; os_name == 'posix'",
  # The session broker is an ordinary web server: a Starlette application served by uvicorn. A session reaches it
  # with httpx (to send) and websockets (to be reachable). The floors are the oldest versions the broker's tests
  # were run against; all of them arrive through the runtime today and are declared so that is not luck.
  "starlette>=0.48,<2",
  "uvicorn>=0.35,<1",
  "httpx>=0.27,<1",
  "websockets>=15,<17",
  # The HTTP server is part of this package and always installed: `pip install zettcode` writes both console
  # scripts, so `zettcode-server` may not be a command whose dependencies are an optional extra.
  "fastapi>=0.115,<1",
  # The counter behind ``/context`` measures a request with it, and imports it
  # itself: the floor matches the runtime's, so neither resolver has to fight.
  "tiktoken>=0.12,<1",
  "tomli>=2,<3; python_version < '3.11'",
  # The system trust store, so the release check works behind a proxy.
  "truststore>=0.10,<1",
  "wcwidth>=0.2,<1",
  # A range, not a pin: 0.1.13 is the oldest runtime whose tool argument schemas
  # are self-contained — Pydantic's ``$defs``/``$ref`` are expanded when the
  # schema is built — and a gateway that refuses to resolve a pointer otherwise
  # answers 400 to every request on its Messages route. It also keeps the two
  # the floor below it was raised for: the shell tool called ``bash``, which this
  # client's phrasing, colours, and approval path are keyed on, and SQLAlchemy,
  # tiktoken, and httpx behind their first use, so warming a runtime costs less
  # than it did. An exact pin would make zettcode fight every other tool that
  # shares the dependency — including an upgrade of zett-agent itself, which pip
  # would downgrade to satisfy it. 0.2.2 is the floor for one reason this program
  # now leans on: a hosted tool the provider left open is closed with
  # ``output={"status": "not_reported"}`` instead of leaving the step waiting, and
  # `engine/server_tools.describe_output` reads that to say so.
  "zett-agent>=0.2.2,<0.3",
]

[project.scripts]
zettcode = "zettcode.cli:main"
zettcode-server = "zettcode.server.cli:main"
zettcode-gateway = "zettcode.gateway.cli:main"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth: the version is written once, in the package.
path = "src/zettcode/__init__.py"

# The gateway's page is built (make gateway-ui) into the package and is not in git; hatchling skips what git ignores
# unless it is named here.
[tool.hatch.build]
artifacts = ["src/zettcode/gateway/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "zettcode-monitor"
description = "A ZettCode plugin: /monitor records every model call of a session and exports it as an HTML report"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "plugin", "llm", "monitor", "debugging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
dependencies = [
  # Imported directly (the command, the plugin base classes). ``zettcode.app.plugins`` first ships in the release
  # after 0.1.10, so that release is the floor; the 0.2 line kept that plugin API, so the range takes every 0.2.x
  # too instead of stopping at <0.2 and letting pip downgrade a 0.2 install out from under the plugin.
  "zettcode>=0.1.11,<0.3",
  # Imported directly for the extension hooks and message types; the floor zettcode itself asks for, so an
  # environment carries one zett-agent.
  "zett-agent>=0.2.1,<0.3",
]

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode/tree/main/plugins/zettcode-monitor"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[project.entry-points."zettcode.plugins"]
monitor = "zettcode_monitor:MonitorPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/zettcode_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode_monitor"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

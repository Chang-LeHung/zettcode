[project]
name = "zettcode-messaging"
description = "Talking to the other ZettCode sessions — the messaging tools and the line to the broker — as a part of the agent that lives apart from it"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "messaging", "agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # The plugin base classes, the service names, and the modes a message is sent with.
  "zettcode-engine",
  # The protocol, the client and the errors the tools speak.
  "zettcode-broker",
  # The tools this subclasses.
  "zett-agent>=0.2.7,<0.3",
]

# A part of the program, not a plugin: the `zettcode.plugins` group is what the plugin release line looks for.
[project.entry-points."zettcode.agent"]
messaging = "zettcode.messaging.plugin:Messaging"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "zettcode-plugin-api"
description = "The one package a ZettCode plugin depends on: the plugin surface, re-exported"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "plugin", "api"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # The bottom of the graph a plugin lives in: the runtime it hooks into and the widgets it draws with. Never the
  # application, never an implementation of what this package defines, and not the SDK -- see the extra below.
  "zettcode-engine",
  "zettcode-tui",
]

[project.optional-dependencies]
# `host.client` is the SDK's client and a hook is handed its `Usage` and `ModelInfo`, so a plugin that is type-checked
# needs the SDK to resolve those names. Nothing is *imported* from it at run time (every one is a `TYPE_CHECKING`
# reference, and the contract's names all resolve with the SDK unimportable), so a plugin that only runs does not pull
# the broker's web stack in for it: it asks for this extra when it wants its types.
types = ["zettcode-sdk"]

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

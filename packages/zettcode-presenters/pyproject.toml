[project]
name = "zettcode-presenters"
description = "The conversation's rows and how ZettCode's terminal draws them"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "presenters", "transcript"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # Written against the plugin contract, which is where the row model and the presenter base class are defined.
  "zettcode-plugin-api>=0.4.5,<0.5",
  # The `[statusline]` vocabulary (`statusline_parts`) and the TOML reader the boot labels use.
  "zettcode-engine>=0.4.5,<0.5",
  "zettcode-tui>=0.4.5,<0.5",
]

[project.optional-dependencies]
# The wording reads `Usage` figures the SDK defines; it is imported for the annotation only.
types = ["zettcode-sdk>=0.4.5,<0.5"]

# A part of the program, not a plugin: the `[tool.zettcode] plugin = true` marker is what the plugin release line looks for.
[project.entry-points."zettcode.plugin"]
presenters = "zettcode.presenters.plugin:PresentersPlugin"
shell = "zettcode.presenters.rows:ShellRows"
turn-line = "zettcode.presenters.rows:TurnLine"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

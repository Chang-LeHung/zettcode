[project]
name = "zettcode-monitor"
description = "A ZettCode plugin: /monitor records every model call of a session and exports it as an HTML report"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "plugin", "llm", "monitor", "debugging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
dependencies = [
  # Imported directly (the command, the plugin base classes). The plugin API this release uses — `PluginContext`,
  # `TuiPlugin`, the three groups — is new in 0.3, and the 0.2 line still spells it `TerminalPlugin` /
  # `TerminalContainer`, so the floor is the 0.3 line and the cap the one after it.
  "zettcode-plugin-api>=0.4.6,<0.5",
  # Imported directly for the extension hooks and message types; the floor zettcode itself asks for, so an
  # environment carries one zett-agent.
  "zett-agent>=0.2.10,<0.3",
]

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode/tree/main/packages/zettcode-monitor"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[project.entry-points."zettcode.plugin"]
monitor = "zettcode.monitor:MonitorPlugin"

[tool.zettcode]
# Published on its own line and installed by a reader: the group name no longer says which packages are plugins.
plugin = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/zettcode/monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
# What the tests import beyond the plugin itself. The workspace's own dev group carries the same names for `make test`;
# this one is what the release workflow installs into the fresh environment it tests the built plugin in, so a
# test-only import a plugin gains is declared here rather than guessed there.
dev = ["packaging>=24,<27", "pytest>=8,<9", "pytest-asyncio>=0.26,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

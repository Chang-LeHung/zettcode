[project]
name = "zettcode-sdk"
description = "The documented, stable Python surface over ZettCode: sessions, runs, models, daemons"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "sdk", "agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "zettcode-engine",
  "zettcode-broker",
  # Parts of the agent that live in distributions of their own, found through the same `zettcode.agent` entry point as
  # the ones published here. An SDK client offers skills and MCP servers, so it installs them.
  "zettcode-skills",
  "zettcode-mcp",
  "zettcode-files",
  "zettcode-harness",
  "zett-agent>=0.2.7,<0.3",
  "httpx>=0.27,<1",
]

# The plugins that compose the agent. A part of the program, not a plugin: the `zettcode.plugins` group is what the
# plugin release line looks for. They are activated by the rank `builtins.py` gives them, then by their `deps`.
[project.entry-points."zettcode.agent"]
coding = "zettcode.sdk.builtins:CodingTools"
tool-output = "zettcode.sdk.builtins:ToolOutput"
long-output = "zettcode.sdk.builtins:LongOutput"
capabilities = "zettcode.sdk.builtins:Capabilities"
subagents = "zettcode.sdk.builtins:Subagents"
messaging = "zettcode.sdk.builtins:Messaging"
shell-permission = "zettcode.sdk.builtins:ShellPermission"
session-log = "zettcode.sdk.builtins:SessionLog"
todos = "zettcode.sdk.builtins:TodoPlan"
usage-tracking = "zettcode.sdk.builtins:UsageTracking"
context-tracking = "zettcode.sdk.builtins:ContextTracking"
side-questions = "zettcode.sdk.builtins:SideQuestionBoundary"
tool-guidelines = "zettcode.sdk.builtins:ToolGuidance"
ask-user = "zettcode.sdk.builtins:AskUser"
project-instructions = "zettcode.sdk.builtins:ProjectInstructions"
self-compaction = "zettcode.sdk.builtins:SelfCompaction"
compaction = "zettcode.sdk.builtins:Compaction"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

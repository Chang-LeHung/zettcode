[project]
name = "zettcode-sdk"
description = "The documented, stable Python surface over ZettCode: sessions, runs, models, daemons"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "sdk", "agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "zettcode-engine>=0.4.6,<0.5",
  "zettcode-broker>=0.4.6,<0.5",
  # Parts of the agent that live in distributions of their own, found through the same `zettcode.plugin` group as
  # the ones published here. An SDK client offers skills and MCP servers and runs the same agent, so it installs them
  # all; `require_agent_parts` refuses a start that lacks one.
  "zettcode-skills>=0.4.6,<0.5",
  "zettcode-messaging>=0.4.6,<0.5",
  "zettcode-mcp>=0.4.6,<0.5",
  "zettcode-files>=0.4.6,<0.5",
  "zettcode-jit-harness>=0.4.6,<0.5",
  "zettcode-ask-user>=0.4.6,<0.5",
  "zettcode-instructions>=0.4.6,<0.5",
  "zettcode-memory>=0.4.6,<0.5",
  "zettcode-todos>=0.4.6,<0.5",
  "zettcode-tool-output>=0.4.6,<0.5",
  "zettcode-truncation>=0.4.6,<0.5",
  "zettcode-guidance>=0.4.6,<0.5",
  "zett-agent>=0.2.10,<0.3",
  "httpx>=0.27,<1",
]

# The plugins that compose the agent. A part of the program, not a plugin: the `[tool.zettcode] plugin = true`
# marker is what the plugin release line looks for. They are activated by the rank `builtins.py` gives them, then by their `deps`.
[project.entry-points."zettcode.plugin"]
coding = "zettcode.sdk.builtins:CodingTools"
commandline = "zettcode.sdk.builtins:CommandLine"
capabilities = "zettcode.sdk.builtins:Capabilities"
subagents = "zettcode.sdk.builtins:Subagents"
shell-permission = "zettcode.sdk.builtins:ShellPermission"
session-log = "zettcode.sdk.builtins:SessionLog"
usage-tracking = "zettcode.sdk.builtins:UsageTracking"
context-tracking = "zettcode.sdk.builtins:ContextTracking"
side-questions = "zettcode.sdk.builtins:SideQuestionBoundary"
self-compaction = "zettcode.sdk.builtins:SelfCompaction"
compaction = "zettcode.sdk.builtins:Compaction"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

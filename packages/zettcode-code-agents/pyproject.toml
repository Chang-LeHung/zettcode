[project]
name = "zettcode-code-agents"
description = "Gateway plugins that run Codex and Claude Code as persistent external agents"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "gateway", "codex", "claude", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = [
  "zettcode-broker>=0.4.6,<0.5",
  "zettcode-gateway>=0.4.6,<0.5",
]

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode/tree/main/packages/zettcode-code-agents"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[project.entry-points."zettcode.gateway.external"]
codex = "zettcode.code_agents:CodexAgent"
claude = "zettcode.code_agents:ClaudeCodeAgent"

[tool.zettcode]
# A gateway plugin: installed beside the program, released on the plugin line.
plugin = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/zettcode/code_agents/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
# What the tests import beyond the plugin itself; the release workflow installs exactly this into the fresh environment it
# tests the built plugin in, so a name missing here passes `make test` (the workspace has it) and fails the release. The
# turns are `async def`, which needs pytest-asyncio.
dev = ["pytest>=8,<9", "pytest-asyncio>=0.26,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

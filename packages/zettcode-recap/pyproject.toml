[project]
name = "zettcode-recap"
description = "A ZettCode plugin: /recap sums up where the session is, and does so on its own when you step away"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "plugin", "recap", "summary", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = [
  # The plugin API: `PluginContext`, `TuiPlugin`, and the terminal group's focus and turn-end hooks, which the 0.3
  # line added. The recap also asks with `ask(origin=)`, which 0.3.0-0.3.3 do not take: raise this floor to the release
  # that ships it, in the same commit that sets that version.
  "zettcode-plugin-api>=0.4.5,<0.5",
]

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode/tree/main/packages/zettcode-recap"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[project.entry-points."zettcode.plugin"]
recap = "zettcode.recap:RecapPlugin"

[tool.zettcode]
# Published on its own line and installed by a reader: the group name no longer says which packages are plugins.
plugin = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/zettcode/recap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
# What the tests import beyond the plugin itself. The workspace's own dev group carries the same names for `make test`;
# this one is what the release workflow installs into the fresh environment it tests the built plugin in, so a
# test-only import a plugin gains is declared here rather than guessed there.
dev = ["packaging>=24,<27", "pytest>=8,<9", "pytest-asyncio>=0.26,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "zettcode-one-system"
description = "Every instruction ZettCode gives the model in one system message, as a part of the agent that lives apart from it"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "prompt", "system-message", "agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # The plugin base classes.
  "zettcode-engine>=0.5.1,<0.6",
  # The message types and the extension hook the merge runs on.
  "zett-agent>=0.3.1,<0.4",
]

# A part of the program, not a separately released plugin: the `[tool.zettcode] plugin = true` marker is what the
# plugin release line looks for, and this ships with the program like the tool guidelines and the long-output cut. It is
# on unless `[plugins] disable = ["one-system"]` names it.
[project.entry-points."zettcode.plugin"]
one-system = "zettcode.one_system.plugin:OneSystem"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

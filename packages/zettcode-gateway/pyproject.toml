[project]
name = "zettcode-gateway"
description = "The web gateway of ZettCode: the chat page and the graph over a running server"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "gateway", "web"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "zettcode-engine",
  "zettcode-sdk",
  "zettcode-broker",
  "starlette>=0.51,<2",
  "uvicorn>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build]
# The gateway's page is built (make gateway-page) into the package and is not in git; hatchling skips what git
# ignores unless it is named here.
artifacts = ["src/zettcode/gateway/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

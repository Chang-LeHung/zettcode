[project]
name = "zettcode-commands"
description = "The slash commands that act on ZettCode's terminal application, offered to it as a plugin"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "commands", "terminal"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # Written against the plugin contract, and the pages the commands open are the application's own widgets.
  "zettcode-plugin-api",
  "zettcode-engine",
  "zettcode-tui",
  "zettcode-sdk",
  "zettcode-app",
  "zettcode-presenters",
]

# A part of the program, not a plugin: the `[tool.zettcode] plugin = true` marker is what the plugin release line looks for.
[project.entry-points."zettcode.plugin"]
commands = "zettcode.commands.plugin:CommandsPlugin"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "zettcode"
description = "A focused terminal coding agent powered by zett-agent"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["agent", "llm", "tui", "terminal", "coding-agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # What this program is built from. Every part is a distribution of its own -- the engine, the widget framework, the
  # broker, the SDK, the server, the gateway, the terminal application -- and `pip install zettcode` still installs all
  # of them with one version, because this distribution is the one a reader asks for.
  "zettcode-engine[tiktoken]",
  "zettcode-tui",
  "zettcode-broker",
  "zettcode-sdk",
  "zettcode-server",
  "zettcode-gateway",
  "zettcode-app",
  # Named here, not only inherited: the command line names the process with it.
  "setproctitle>=1.3.7,<2; os_name == 'posix'",
]

[project.optional-dependencies]
# A plugin this repository ships, for reading what a session actually sent and received: `pip install
# "zettcode[monitor]"` adds `/monitor`. It is an extra and not a dependency on purpose — it records every model
# request and response unredacted, which is a debugging tool and not something to hand everyone — and a hard edge
# would tie the two projects' releases together: a new minor line of zettcode would need a monitor published first
# that accepts it (its range has to allow both lines in between), or `pip install zettcode==<new>` would fail to
# resolve, and so would the environment the VS Code extension builds for itself.
monitor = ["zettcode-monitor>=0.2,<0.3"]
# `/recap` for a reader who steps away. Published on its own line like the one above, and an extra for the same
# reason: a hard edge would tie the two releases together.
recap = ["zettcode-recap>=0.1,<0.2"]
# Every plugin this repository publishes, for a reader who wants the lot: `pip install "zettcode[all]"`.
all = ["zettcode-monitor>=0.2,<0.3", "zettcode-recap>=0.1,<0.2"]

[project.scripts]
zettcode = "zettcode.cli:main"
zettcode-server = "zettcode.server.cli:main"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
# The namespace itself: this distribution adds only the command line to it, and no `zettcode/__init__.py`.
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/perf", "/README.md", "/pyproject.toml"]

[project]
name = "zettcode"
description = "A focused terminal coding agent powered by zett-agent"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["agent", "llm", "tui", "terminal", "coding-agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # What this program is built from. Every part is a distribution of its own -- the engine, the widget framework, the
  # broker, the SDK, the server, the gateway, the terminal application -- and `pip install zettcode` still installs all
  # of them with one version, because this distribution is the one a reader asks for.
  "zettcode-engine[tiktoken]>=0.4.7,<0.5",
  "zettcode-tools>=0.4.7,<0.5",
  "zettcode-tui>=0.4.7,<0.5",
  "zettcode-broker>=0.4.7,<0.5",
  "zettcode-sdk>=0.4.7,<0.5",
  "zettcode-server>=0.4.7,<0.5",
  "zettcode-gateway>=0.4.7,<0.5",
  "zettcode-app>=0.4.7,<0.5",
  "zettcode-plugin-api>=0.4.7,<0.5",
  "zettcode-presenters>=0.4.7,<0.5",
  "zettcode-pets>=0.4.7,<0.5",
  "zettcode-commands>=0.4.7,<0.5",
  "zettcode-skills>=0.4.7,<0.5",
  "zettcode-messaging>=0.4.7,<0.5",
  "zettcode-mcp>=0.4.7,<0.5",
  "zettcode-files>=0.4.7,<0.5",
  "zettcode-jit-harness>=0.4.7,<0.5",
  "zettcode-ask-user>=0.4.7,<0.5",
  "zettcode-instructions>=0.4.7,<0.5",
  "zettcode-memory>=0.4.7,<0.5",
  "zettcode-todos>=0.4.7,<0.5",
  "zettcode-tool-output>=0.4.7,<0.5",
  "zettcode-truncation>=0.4.7,<0.5",
  "zettcode-guidance>=0.4.7,<0.5",
  # Named here, not only inherited: the command line names the process with it.
  "setproctitle>=1.3.7,<2; os_name == 'posix'",
]

[project.optional-dependencies]
# A plugin this repository ships, for reading what a session actually sent and received: `pip install
# "zettcode[monitor]"` adds `/monitor`. It is an extra and not a dependency on purpose — it records every model
# request and response unredacted, which is a debugging tool and not something to hand everyone. The range is the one
# every distribution of ours carries (`make version` writes it): the plugins are published from this repository at
# the same version as the program, so `zettcode 0.4.5` and `zettcode-monitor 0.4.5` are the pair that was tested.
monitor = ["zettcode-monitor>=0.4.7,<0.5"]
# `/recap` for a reader who steps away. An extra for the same reason as the one above, and on the same version line.
recap = ["zettcode-recap>=0.4.7,<0.5"]
# An official model for each vendor API key in the environment. Off until `[plugins] enable = ["models"]`
# names it: ambient keys should not change a model list by themselves.
models = ["zettcode-models>=0.4.7,<0.5"]
# Every plugin this repository publishes, for a reader who wants the lot: `pip install "zettcode[all]"`.
all = ["zettcode-monitor>=0.4.7,<0.5", "zettcode-recap>=0.4.7,<0.5", "zettcode-models>=0.4.7,<0.5"]

[project.scripts]
zettcode = "zettcode.cli:main"
zettcode-server = "zettcode.server.cli:main"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
# The namespace itself: this distribution adds only the command line to it, and no `zettcode/__init__.py`.
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/perf", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

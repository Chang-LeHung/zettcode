[project]
name = "zettcode-app"
description = "The terminal application of ZettCode: the conversation model, the shell and its views"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "terminal", "tui", "agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "zettcode-engine>=0.4.7,<0.5",
  "zettcode-tui>=0.4.7,<0.5",
  "zettcode-sdk>=0.4.7,<0.5",
  "zettcode-broker>=0.4.7,<0.5",
  # The line to the other sessions, which the shell's agent carries and matches messages against.
  "zettcode-messaging>=0.4.7,<0.5",
  "zettcode-plugin-api>=0.4.7,<0.5",
  "zettcode-presenters>=0.4.7,<0.5",
  "zett-agent>=0.2.10,<0.3",
  # The release check verifies the index against the system trust store; imported by `update.py` with a
  # fallback, so it is a hint rather than a requirement.
  "truststore>=0.10,<1",
]

# Parts of the program that need a screen, loaded as plugins by the terminal only; see the engine's plugin loader.
[project.entry-points."zettcode.plugin"]
themes = "zettcode.app.plugins.builtins:BuiltinThemes"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "zettcode-todos"
description = "The todo_write tool and the plan it keeps, as a part of the agent that lives apart from it"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "todos", "agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # The plugin base classes, the name the plan is provided under, and the switch the runtime provides.
  "zettcode-engine",
  # The extension the plan is.
  "zett-agent>=0.2.10,<0.3",
]

# A part of the program, not a plugin: the `[tool.zettcode] plugin = true` marker is what the plugin release line looks for. It is
# activated with the agent's other parts and `[harness] todowrite` is what gives the model the tool.
[project.entry-points."zettcode.plugin"]
todos = "zettcode.todos.plugin:TodoPlan"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "zettcode-jit-harness"
description = "The just-in-time tool harness of ZettCode: its extension, its page and the command that opens it"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "harness", "agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  # The plugin base classes, the switch the runtime provides, the shell policy and the notice the transcript knows.
  "zettcode-engine",
  # The widget framework the `/harness` page is drawn with, and the contract the command is written against.
  "zettcode-tui",
  "zettcode-plugin-api",
  # The harness this subclasses.
  "zett-agent>=0.2.7,<0.3",
]

# A part of the program, not a plugin: the `zettcode.plugins` group is what the plugin release line looks for. It is
# activated with the agent's other parts and `[harness] jit` is what turns it on. Its page and its command live here
# with it, so the part owns the whole screen and the command no longer ships with the shell's own commands.
[project.entry-points."zettcode.plugin"]
harness = "zettcode.jit_harness.plugin:Harness"

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One version for the whole repository: the engine ships the file.
path = "../zettcode-engine/src/zettcode/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

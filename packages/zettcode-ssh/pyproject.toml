[project]
name = "zettcode-ssh"
description = "A ZettCode plugin: use the coding tools in a remote workspace over OpenSSH"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang-LeHung"}]
keywords = ["zettcode", "plugin", "ssh"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = ["zettcode-plugin-api>=0.5.1,<0.6", "zett-agent>=0.3.0,<0.4", "pydantic>=2,<3"]

[project.urls]
Repository = "https://github.com/Chang-LeHung/zettcode/tree/main/packages/zettcode-ssh"
Issues = "https://github.com/Chang-LeHung/zettcode/issues"

[project.entry-points."zettcode.plugin"]
ssh = "zettcode.ssh:SSHPlugin"

[tool.zettcode]
plugin = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/zettcode/ssh/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/Makefile", "/pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.26,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
